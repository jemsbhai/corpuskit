[project]
name = "corpuskit-app"
version = "0.1.0a1"
description = "Production corpus-design workbench powered by CorpusGen"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Muntaser Syed", email = "jemsbhai@gmail.com" }]
keywords = ["speech", "corpus", "phonetics", "tts", "asr", "corpusgen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "alembic>=1.16,<2",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "corpusgen==0.1.7",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4,<26",
  "temporalio>=1.16,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
optimization = ["corpusgen[optimization]==0.1.7"]
repository = ["corpusgen[repository]==0.1.7"]
llm = ["corpusgen[llm]==0.1.7"]
local = ["corpusgen[local]==0.1.7"]
worker-batch = ["corpusgen[local,optimization]==0.1.7"]
worker-external-provider = ["corpusgen[llm,repository]==0.1.7"]
worker-gpu-inference = ["corpusgen[local]==0.1.7"]
worker-gpu-training = ["corpusgen[local]==0.1.7"]

[project.scripts]
corpuskit-api = "corpuskit.api.cli:main"
corpuskit-continuity = "corpuskit.operations.continuity_cli:main"
corpuskit-db = "corpuskit.persistence.migration_cli:main"
corpuskit-dispatcher = "corpuskit.worker.dispatcher_cli:main"
corpuskit-maintenance = "corpuskit.operations.maintenance_cli:main"
corpuskit-phoible = "corpuskit.operations.phoible_cli:main"
corpuskit-worker = "corpuskit.worker.cli:main"

[project.urls]
Homepage = "https://github.com/jemsbhai/corpuskit"
Documentation = "https://github.com/jemsbhai/corpuskit/tree/main/docs"
Issues = "https://github.com/jemsbhai/corpuskit/issues"
Repository = "https://github.com/jemsbhai/corpuskit"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpuskit"]

[tool.hatch.build.targets.sdist]
# Do not let VCS state determine the publication boundary. In particular, a first
# build from a newly created repository must never traverse node_modules or local
# runtime data merely because those paths have not been committed yet.
only-include = ["src", "CHANGELOG.md"]

[dependency-groups]
build = [
  "hatchling==1.32.0",
]
dev = [
  "diff-cover>=9,<10",
  "hypothesis>=6.138,<7",
  "mutmut==3.7.0",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "psutil==7.2.2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "pytest-xdist>=3.8,<4",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-pyjwt>=1.7,<2",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=corpuskit",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
  "integration: requires real external services or system dependencies",
  "slow: long-running model, optimization, or training test",
  "gpu: requires a supported CUDA GPU",
  "provider: uses a budget-capped live external provider",
]

[tool.coverage.run]
branch = true
source = ["corpuskit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "ASYNC", "C4", "DTZ", "G", "PIE", "PT", "RET", "RUF", "S", "SIM", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
packages = ["corpuskit"]

[[tool.mypy.overrides]]
module = ["corpusgen.*"]
ignore_missing_imports = true

[tool.mutmut]
# A bounded but substantive critical/core wave. The score checker separately
# enforces two security-critical modules and this full three-module core set.
source_paths = ["src/corpuskit"]
only_mutate = [
  "src/corpuskit/auth/dependencies.py",
  "src/corpuskit/domain/corpora.py",
  "src/corpuskit/services/run_admission.py",
]
pytest_add_cli_args = ["-o", "addopts=", "-q"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_advanced_app_integration.py",
  "tests/unit/test_auth.py",
  "tests/unit/test_corpus_domain.py",
]
mutate_only_covered_lines = false
timeout_multiplier = 4.0
timeout_constant = 2.0
track_dependencies = true
use_git_change_detection = false
