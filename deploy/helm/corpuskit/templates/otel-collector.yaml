{{- if and .Values.monitoring.enabled .Values.monitoring.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "corpuskit.fullname" . }}-otel-collector
  labels:
    {{- include "corpuskit.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
data:
  collector.yaml: |-
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: corpuskit-api
              scrape_interval: {{ .Values.monitoring.scrapeInterval }}
              scrape_timeout: {{ .Values.monitoring.scrapeTimeout }}
              metrics_path: /internal/metrics
              authorization:
                type: Bearer
                credentials_file: /run/secrets/metrics/token
              static_configs:
                - targets: [{{ printf "%s-api:8000" (include "corpuskit.fullname" .) | quote }}]
                  labels:
                    namespace: {{ .Release.Namespace | quote }}
                    corpuskit_environment: {{ .Values.global.environment | quote }}
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 768
        spike_limit_mib: 192
      resource:
        attributes:
          - {key: service.namespace, value: corpuskit, action: upsert}
          - {key: deployment.environment.name, value: {{ .Values.global.environment | quote }}, action: upsert}
          - {key: k8s.namespace.name, value: {{ .Release.Namespace | quote }}, action: upsert}
      batch:
        send_batch_size: 8192
        timeout: 5s
    exporters:
      otlphttp:
        endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
        headers:
          Authorization: ${env:OTEL_EXPORTER_OTLP_AUTHORIZATION}
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 4096
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        metrics:
          receivers: [prometheus, otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "corpuskit.fullname" . }}-telemetry
  labels:
    {{- include "corpuskit.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
spec:
  replicas: {{ .Values.monitoring.otelCollector.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "corpuskit.selectorLabels" (dict "root" . "component" "telemetry") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson .Values.monitoring.otelCollector | sha256sum }}
      labels:
        {{- include "corpuskit.selectorLabels" (dict "root" . "component" "telemetry") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.telemetry }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "corpuskit.podSecurityContext" . | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "corpuskit.selectorLabels" (dict "root" . "component" "telemetry") | nindent 20 }}
      containers:
        - name: collector
          image: {{ include "corpuskit.image" (dict "image" .Values.monitoring.otelCollector.image) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: [--config=/etc/otelcol/collector.yaml]
          securityContext:
            {{- include "corpuskit.containerSecurityContext" . | nindent 12 }}
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.monitoring.otelCollector.exporterEndpoint | quote }}}
            - name: OTEL_EXPORTER_OTLP_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.monitoring.otelCollector.exporterAuthorization.secretName }}
                  key: {{ .Values.monitoring.otelCollector.exporterAuthorization.key }}
          ports:
            - {name: otlp-grpc, containerPort: 4317, protocol: TCP}
            - {name: otlp-http, containerPort: 4318, protocol: TCP}
            - {name: health, containerPort: 13133, protocol: TCP}
          startupProbe: {httpGet: {path: /, port: health}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /, port: health}, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /, port: health}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
          resources:
            {{- toYaml .Values.monitoring.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: metrics-token, mountPath: /run/secrets/metrics, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ include "corpuskit.fullname" . }}-otel-collector}
        - name: metrics-token
          secret:
            secretName: {{ .Values.metrics.bearerToken.secretName }}
            items: [{key: {{ .Values.metrics.bearerToken.key }}, path: token}]
        {{- include "corpuskit.tmpVolume" "128Mi" | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "corpuskit.fullname" . }}-telemetry
  labels:
    {{- include "corpuskit.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
spec:
  selector:
    {{- include "corpuskit.selectorLabels" (dict "root" . "component" "telemetry") | nindent 4 }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "corpuskit.fullname" . }}-telemetry
  labels: {{- include "corpuskit.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "corpuskit.selectorLabels" (dict "root" . "component" "telemetry") | nindent 6 }}
{{- end }}
