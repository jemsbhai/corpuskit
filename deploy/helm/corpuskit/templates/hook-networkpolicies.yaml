{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "corpuskit.fullname" . }}-hook-migrator
  labels:
    {{- include "corpuskit.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator-hook-policy
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-25"
    helm.sh/hook-delete-policy: before-hook-creation,hook-failed
spec:
  podSelector:
    matchLabels:
      {{- include "corpuskit.selectorLabels" (dict "root" . "component" "migrator") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "corpuskit.dnsEgress" . | nindent 4 }}
    {{- include "corpuskit.cidrEgress" (dict "cidrs" .Values.networkPolicy.cidrs.database "port" .Values.database.port) | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "corpuskit.fullname" . }}-hook-phoible
  labels:
    {{- include "corpuskit.labels" . | nindent 4 }}
    app.kubernetes.io/component: phoible-hook-policy
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-25"
    helm.sh/hook-delete-policy: before-hook-creation,hook-failed
spec:
  podSelector:
    matchLabels:
      {{- include "corpuskit.selectorLabels" (dict "root" . "component" "phoible") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  {{- if .Values.phoible.sourceClaim }}
  egress: []
  {{- else }}
  egress:
    {{- include "corpuskit.dnsEgress" . | nindent 4 }}
    {{- include "corpuskit.cidrEgress" (dict "cidrs" .Values.networkPolicy.cidrs.phoibleSource "port" 443) | nindent 4 }}
  {{- end }}
{{- end }}
