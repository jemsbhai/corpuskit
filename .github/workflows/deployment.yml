name: Deployment contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deployment.yml
      - deploy/helm/**
      - docs/operations/kubernetes-production.md
      - docs/operations/telemetry-contract.md
      - src/corpuskit/config.py
      - src/corpuskit/api/cli.py
      - src/corpuskit/worker/**
      - src/corpuskit/operations/maintenance_cli.py
      - tests/deployment/**
      - pyproject.toml
      - uv.lock
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deployment.yml
      - deploy/helm/**
      - docs/operations/kubernetes-production.md
      - docs/operations/telemetry-contract.md
      - src/corpuskit/config.py
      - src/corpuskit/api/cli.py
      - src/corpuskit/worker/**
      - src/corpuskit/operations/maintenance_cli.py
      - tests/deployment/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: "4.2.3"
  HELM_SHA256: e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  CRD_CATALOG_REVISION: 52b0261318acc7dd0b66e032759b1f218216b980
  UV_VERSION: "0.12.3"

jobs:
  validate:
    name: Helm, policy, and Kubernetes schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends espeak-ng

      - name: Install checksum-verified deployment tools
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/corpuskit-deployment-tools"
          mkdir -p "${tool_dir}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" \
            --output "${tool_dir}/helm.tar.gz"
          echo "${HELM_SHA256}  ${tool_dir}/helm.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${tool_dir}/helm.tar.gz" --directory "${tool_dir}"
          install --mode 0755 "${tool_dir}/linux-amd64/helm" "${tool_dir}/helm"

          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "${tool_dir}/kubeconform.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${tool_dir}/kubeconform.tar.gz" | \
            sha256sum --check --strict
          tar --extract --gzip --file "${tool_dir}/kubeconform.tar.gz" --directory "${tool_dir}"
          chmod 0755 "${tool_dir}/kubeconform"
          echo "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Install locked test environment
        run: uv sync --frozen

      - name: Validate chart and negative policy tests
        env:
          CORPUSKIT_REQUIRE_HELM: "1"
          HELM_BIN: ${{ runner.temp }}/corpuskit-deployment-tools/helm
        run: uv run pytest tests/deployment -q --no-cov

      - name: Render immutable production topology
        run: |
          helm lint deploy/helm/corpuskit --strict \
            --values deploy/helm/corpuskit/ci/production-values.yaml
          helm template acceptance deploy/helm/corpuskit \
            --namespace corpuskit-prod \
            --include-crds \
            --values deploy/helm/corpuskit/ci/production-values.yaml \
            > "${RUNNER_TEMP}/corpuskit-rendered.yaml"

      - name: Validate built-in and Prometheus Operator schemas
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.35.0 \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_REVISION}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            "${RUNNER_TEMP}/corpuskit-rendered.yaml"
